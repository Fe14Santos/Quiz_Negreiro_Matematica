<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Floresta de Negreiros </title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            //background: linear-gradient(135deg, #667eea, #764ba2);
			background: linear-gradient(135deg, #2e7d32, #81c784);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 750px;
        }

        .quiz-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #333;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
            font-size: 16px;
        }

        .progress-container {
            margin-bottom: 30px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e9e9e9;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 20%;
            background: #2e7d32;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .question {
            color: #222;
            font-size: 22px;
            line-height: 1.4;
            margin-bottom: 25px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            width: 100%;
            padding: 16px 18px;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: #fff;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .option:hover:not(:disabled) {
            border-color: #667eea;
            background: #f5f6ff;
            transform: translateY(-1px);
        }

        .option:disabled {
            cursor: default;
        }

        .option.correct {
            border-color: #28a745;
            background: #eaf8ee;
            color: #176b2c;
        }

        .option.incorrect {
            border-color: #dc3545;
            background: #fdecee;
            color: #a51d2a;
        }

        .feedback {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 15px;
        }

        .feedback.correct {
            display: block;
            background: #eaf8ee;
            color: #176b2c;
        }

        .feedback.incorrect {
            display: block;
            background: #fdecee;
            color: #a51d2a;
        }

        .actions {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }

        .next-button {
            border: none;
            background: #667eea;
            color: white;
            padding: 14px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .next-button:hover {
            background: #5568d8;
            transform: translateY(-1px);
        }

        .next-button:disabled {
            background: #bbb;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            display: none;
            text-align: center;
        }

        .result-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .result h2 {
            color: #333;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .result p {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
        }

        .score {
            font-size: 42px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        .restart-button {
            border: none;
            background: #667eea;
            color: #fff;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .restart-button:hover {
            background: #5568d8;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .quiz-card {
                padding: 22px;
            }

            .header h1 {
                font-size: 25px;
            }

            .question {
                font-size: 19px;
            }

            .option {
                font-size: 15px;
                padding: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="quiz-card">

            <!-- CABEÇALHO -->
            <div class="header">
                <h1>🧮 Quiz Floresta de Negreiros</h1>
                <p>Resolva os problemas e teste seus conhecimentos!</p>
            </div>

            <!-- ÁREA DO QUIZ -->
            <div id="quiz">

                <div class="progress-container">
                    <div class="progress-info">
                        <span id="questionNumber">Questão 1 de 8</span>
                        <span id="scoreText">Acertos: 0</span>
                    </div>

                    <div class="progress-bar">
                        <div class="progress" id="progress"></div>
                    </div>
                </div>

                <h2 class="question" id="question">
                    Carregando pergunta...
                </h2>

                <div class="options" id="options"></div>

                <div id="feedback" class="feedback"></div>

                <div class="actions">
                    <button
                        id="nextButton"
                        class="next-button"
                        disabled
                        onclick="nextQuestion()">
                        Próxima questão →
                    </button>
                </div>

            </div>

            <!-- RESULTADO FINAL -->
            <div class="result" id="result">

                <div class="result-icon">🏆</div>

                <h2>Quiz concluído!</h2>

                <p>Você terminou todas as questões.</p>

                <div class="score" id="finalScore">
                    1 / 8
                </div>

                <p id="finalMessage">
                    Parabéns por participar!
                </p>

                <button
                    class="restart-button"
                    onclick="restartQuiz()">
                    🔄 Fazer novamente
                </button>

            </div>

        </div>

    </div>


    <script>

        // ==========================================
        // QUESTÕES
        // ==========================================

        const questions = [

            {
                question:
                    "A Flona de Negreiros possui 3.004,56 hectares. Se uma área de 1.000 hectares for estudada, quantos hectares ainda não foram estudados?",

                options: [
                    "2.104,56 hectares",
                    "1.904,56 hectares",
                    "2.004,56 hectares",
                    "2.204,56 hectares"
                ],

                correct: 2,

                explanation:
                    "aguardando..."
            },

            {
                question:
                    "A Flona de Negreiros foi criada em 2007. Quantos anos se passaram até 2026?",

                options: [
                    "20",
                    "18",
                    "17",
                    "19"
                ],

                correct: 3,

                explanation:
                    "aguardando..."
            },

            {
                question:
                    "Em uma atividade de conservação, 240 mudas nativas foram divididas igualmente em 6 áreas. Quantas mudas foram colocadas em cada área?",

                options: [
                    "50 mudas",
                    "40 mudas",
                    "60 mudas",
                    "30 mudas"
                ],

                correct: 1,

                explanation:
                    "aguardando..."
            },

            {
                question:
                    "Uma equipe percorreu 18 km para estudar a Caatinga pela manhã e mais 12 km à tarde. Quantos quilômetros percorreu ao todo?",

                options: [
                    "35 km",
                    "25 km",
                    "20 km",
                    "30 km"
                ],

                correct: 3,

                explanation:
                    "aguardando..."
            },

            {
                question:
                    "Observe a sequência de observações de espécies da Caatinga:10, 20, 30, 40, ___ Qual é o próximo número?",

                options: [
                    "60",
                    "55",
                    "45",
                    "50"
                ],

                correct: 3,

                explanation:
                    "aguardando"
            }
			,
            {
                question:
                    "Uma área retangular da Flona destinada a uma atividade educativa mede 20 m de comprimento e 10 m de largura. Qual é sua área?",

                options: [
                    "150 m²",
                    "300 m²",
                    "200 m²",
                    "100 m²"
                ],

                correct: 2,

                explanation:
                    "aguardando"
            }
,
            {
                question:
                    "Em uma atividade com 100 mudas de espécies nativas, 20% foram plantadas. Quantas mudas foram plantadas?",

                options: [
                    "40",
                    "10",
                    "20",
                    "30"
                ],

                correct: 2,

                explanation:
                    "aguardando"
            }
			,
            {
                question:
                    "Em uma atividade ambiental participaram 300 pessoas. Se 10% eram estudantes, quantos estudantes participaram?",

                options: [
                    "40",
                    "50",
                    "20",
                    "30"
                ],

                correct: 3,

                explanation:
                    "aguardando"
            }
        ];


        // ==========================================
        // VARIÁVEIS
        // ==========================================

        let currentQuestion = 0;
        let score = 0;
        let answered = false;


        // ==========================================
        // ELEMENTOS DA PÁGINA
        // ==========================================

        const questionElement =
            document.getElementById("question");

        const optionsElement =
            document.getElementById("options");

        const feedbackElement =
            document.getElementById("feedback");

        const nextButton =
            document.getElementById("nextButton");

        const questionNumberElement =
            document.getElementById("questionNumber");

        const scoreTextElement =
            document.getElementById("scoreText");

        const progressElement =
            document.getElementById("progress");

        const quizElement =
            document.getElementById("quiz");

        const resultElement =
            document.getElementById("result");

        const finalScoreElement =
            document.getElementById("finalScore");

        const finalMessageElement =
            document.getElementById("finalMessage");


        // ==========================================
        // MOSTRAR QUESTÃO
        // ==========================================

        function showQuestion() {

            answered = false;

            const question = questions[currentQuestion];

            questionElement.textContent =
                question.question;

            questionNumberElement.textContent =
                `Questão ${currentQuestion + 1} de ${questions.length}`;

            scoreTextElement.textContent =
                `Acertos: ${score}`;

            const progress =
                ((currentQuestion + 1) / questions.length) * 100;

            progressElement.style.width =
                `${progress}%`;

            optionsElement.innerHTML = "";

            feedbackElement.className = "feedback";
            feedbackElement.textContent = "";

            nextButton.disabled = true;

            nextButton.textContent =
                currentQuestion === questions.length - 1
                    ? "Ver resultado →"
                    : "Próxima questão →";


            question.options.forEach((option, index) => {

                const button =
                    document.createElement("button");

                button.className = "option";

                button.textContent =
                    `${String.fromCharCode(65 + index)}) ${option}`;

                button.onclick = () =>
                    selectAnswer(index);

                optionsElement.appendChild(button);

            });

        }


        // ==========================================
        // SELECIONAR RESPOSTA
        // ==========================================

        function selectAnswer(selectedIndex) {

            if (answered) {
                return;
            }

            answered = true;

            const question =
                questions[currentQuestion];

            const optionButtons =
                document.querySelectorAll(".option");

            optionButtons.forEach(button => {
                button.disabled = true;
            });


            // Resposta correta
            optionButtons[question.correct]
                .classList.add("correct");


            if (selectedIndex === question.correct) {

                score++;

                feedbackElement.className =
                    "feedback correct";

                feedbackElement.innerHTML =
                    `<strong>✅ Correto!</strong><br>
                     ${question.explanation}`;

            }

            // Resposta errada
            else {

                optionButtons[selectedIndex]
                    .classList.add("incorrect");

                feedbackElement.className =
                    "feedback incorrect";

                feedbackElement.innerHTML =
                    `<strong>❌ Incorreto.</strong><br>
                     ${question.explanation}`;
            }


            scoreTextElement.textContent =
                `Acertos: ${score}`;

            nextButton.disabled = false;

        }


        // ==========================================
        // PRÓXIMA QUESTÃO
        // ==========================================

        function nextQuestion() {

            if (!answered) {
                return;
            }

            currentQuestion++;

            if (currentQuestion < questions.length) {

                showQuestion();

            } else {

                showResult();

            }

        }
        // ==========================================
        // MOSTRAR RESULTADO
        // ==========================================

        function showResult() {

            quizElement.style.display = "none";

            resultElement.style.display = "block";

            finalScoreElement.textContent =
                `${score} / ${questions.length}`;

            const percentage =
                (score / questions.length) * 100;


            if (percentage === 100) {

                finalMessageElement.textContent =
                    "🎉 Excelente! Você acertou todas as questões!";

            }

            else if (percentage >= 80) {

                finalMessageElement.textContent =
                    "👏 Muito bem! Seu desempenho foi excelente.";

            }

            else if (percentage >= 60) {

                finalMessageElement.textContent =
                    "👍 Bom trabalho! Continue praticando.";

            }

            else {

                finalMessageElement.textContent =
                    "💪 Continue estudando. Você vai melhorar cada vez mais!";

            }

        }

        // ==========================================
        // REINICIAR QUIZ
        // ==========================================

        function restartQuiz() {

            currentQuestion = 0;

            score = 0;

            answered = false;

            quizElement.style.display = "block";

            resultElement.style.display = "none";

            showQuestion();

        }


        // ==========================================
        // INICIALIZAÇÃO
        // ==========================================

        showQuestion();

    </script>

</body>
</html>
